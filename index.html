<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freemasons</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: #181818;
    }

    header {
      padding: 25px 20px;
      background: #0d0d0d;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    .welcome {
      padding: 30px 20px;
      text-align: center;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #bbb;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cards {
      padding: 20px;
      display: grid;
      gap: 15px;
    }

    .card {
      background: #242424;
      padding: 20px;
      border-radius: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🏛️ Freemasons</h1>
      <p>Lodge Member App</p>
    </header>

    <section class="welcome">
      <h2>Welcome</h2>
      <p>Connect with your lodge, members and upcoming events.</p>

      <button onclick="welcomeMessage()">
        Enter App
      </button>
    </section>

    <section class="cards">

      <div class="card">
        <h3>👤 Members</h3>
        <p>View authorized lodge members.</p>
      </div>
