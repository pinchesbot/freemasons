<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lodge App</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #090909;
  color: white;
}

.app {
  max-width: 500px;
  min-height: 100vh;
  margin: auto;
  background: #151515;
  padding-bottom: 80px;
}

header {
  background: #0b0b0b;
  padding: 22px 20px;
  border-bottom: 1px solid #292929;
}

header h1 {
  font-size: 25px;
}

header p {
  color: #999;
  margin-top: 5px;
}

.page {
  display: none;
  padding: 20px;
}

.page.active {
  display: block;
}

.welcome {
  background: linear-gradient(135deg, #242424, #111);
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
}

.welcome h2 {
  margin-bottom: 8px;
}

.welcome p {
  color: #aaa;
  line-height: 1.5;
}

.section-title {
  margin: 20px 0 12px;
  font-size: 19px;
}

.card {
  background: #222;
  border: 1px solid #303030;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 12px;
}

.card h3 {
  margin-bottom: 7px;
}

.card p {
  color: #aaa;
  line-height: 1.4;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  margin-top: 15px;
  background: #d4af37;
  color: #111;
  font-weight: bold;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  height: 70px;
  background: #101010;
  border-top: 1px solid #303030;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-button {
  background: none;
  color: #888;
  padding: 5px;
  margin: 0;
  font-size: 12px;
}

.nav-button.active {
  color: #d4af37;
}

.icon {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.profile {
  text-align: center;
  padding: 25px 10px;
}

.avatar {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: #333;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

.info {
  background: #222;
  padding: 18px;
  border-radius: 15px;
  margin-top: 20px;
  text-align: left;
}

.info p {
  padding: 9px 0;
  border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🏛️ Lodge App</h1>
  <p>Member Portal</p>
</header>

<!-- HOME -->
<section id="home" class="page active">

  <div class="welcome">
    <h2>Welcome 👋</h2>
    <p>
      Welcome to your lodge member portal.
      Stay connected with members, meetings and announcements.
    </p>
  </div>

  <h2 class="section-title">Quick Access</h2>

  <div class="card">
    <h3>📅 Upcoming Meeting</h3>
    <p>Check the latest lodge meeting schedule.</p>
    <button onclick="showPage('events')">View Events</button>
  </div>

  <div class="card">
    <h3>📢 Latest Announcement</h3>
    <p>Important information
